<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Ilustrasi smart biogas digester</title>
  <desc id="desc">Jerrycan transparan berisi limbah organik, kotak sensor ESP32 di atasnya, pipa gas, dan chip data metana, suhu, serta kelembapan.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d1fae5" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#d1fae5" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="slurry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4d7c0f" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#1a2e05" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>

  <circle cx="320" cy="320" r="280" fill="url(#glow)"/>
  <ellipse cx="320" cy="536" rx="214" ry="30" fill="#34d399" opacity=".10" filter="url(#soft)"/>

  <!-- daun dekoratif -->
  <path d="M96 468c34-72 90-90 124-82-8 42-50 92-124 82Z" fill="#34d399" opacity=".12"/>
  <path d="M96 468c30-36 62-58 96-70" stroke="#6ee7b7" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  <path d="M548 292c-18-52-58-74-88-72 2 34 32 72 88 72Z" fill="#34d399" opacity=".10"/>
  <path d="M548 292c-26-24-50-42-76-56" stroke="#6ee7b7" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>

  <!-- jerrycan -->
  <g filter="url(#shadow)">
    <rect x="210" y="230" width="220" height="290" rx="38" fill="url(#glass)" stroke="#5eead4" stroke-opacity=".45" stroke-width="2"/>
    <path d="M252 230v-34c0-16 13-29 29-29h78c16 0 29 13 29 29v34" stroke="#5eead4" stroke-opacity=".32" stroke-width="14" stroke-linecap="round"/>
    <path d="M212 390q40-18 80 0t80 0 56 0v92c0 21-17 38-38 38H250c-21 0-38-17-38-38Z" fill="url(#slurry)"/>
    <path d="M212 390q40-18 80 0t80 0 56 0" stroke="#84cc16" stroke-opacity=".38" stroke-width="2"/>
    <circle cx="278" cy="430" r="7" fill="#a3e635" opacity=".30"/>
    <circle cx="322" cy="452" r="4" fill="#a3e635" opacity=".35"/>
    <circle cx="368" cy="424" r="9" fill="#a3e635" opacity=".22"/>
    <circle cx="398" cy="462" r="5" fill="#a3e635" opacity=".30"/>
    <circle cx="250" cy="474" r="4" fill="#a3e635" opacity=".25"/>
    <path d="M430 372h14M430 412h14M430 452h14" stroke="#5eead4" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
    <path d="M244 268c-8 24-8 52 0 76" stroke="#ecfdf5" stroke-opacity=".18" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- tutup oranye -->
  <g>
    <rect x="285" y="185" width="70" height="48" rx="12" fill="url(#cap)"/>
    <rect x="296" y="174" width="48" height="18" rx="7" fill="#fdba74"/>
    <path d="M301 209h38" stroke="#7c2d12" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- kotak sensor -->
  <g filter="url(#shadow)">
    <rect x="185" y="105" width="170" height="92" rx="18" fill="url(#box)" stroke="#34d399" stroke-opacity=".35"/>
    <rect x="203" y="123" width="86" height="34" rx="6" fill="#022c22" stroke="#34d399" stroke-opacity=".35"/>
    <path d="M211 143l10-10 8 14 10-18 8 14 10-8 8 8" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="326" cy="132" r="5" fill="#34d399"/>
    <circle cx="326" cy="150" r="5" fill="#fbbf24" opacity=".8"/>
    <path d="M210 166h56" stroke="#34d399" stroke-opacity=".25" stroke-width="4" stroke-linecap="round"/>
    <path d="M334 105V77" stroke="#34d399" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="334" cy="72" r="5" fill="#34d399"/>
  </g>

  <!-- kabel -->
  <path d="M250 197c-14 20 12 22 4 34" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  <path d="M270 197c-8 16 14 18 6 30" stroke="#fb7185" stroke-width="3" stroke-linecap="round" opacity=".72"/>
  <path d="M290 197c-4 12 10 14 4 24" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".85"/>

  <!-- pipa gas -->
  <g>
    <path d="M430 350h56c22 0 40 18 40 40v58c0 22 18 40 40 40" stroke="#64748b" stroke-width="18" stroke-linecap="round"/>
    <path d="M430 350h56c22 0 40 18 40 40v58c0 22 18 40 40 40" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <rect x="480" y="360" width="14" height="28" rx="4" fill="#f59e0b"/>
    <circle cx="487" cy="374" r="4" fill="#451a03"/>
  </g>
  <circle cx="558" cy="500" r="6" fill="#34d399" opacity=".50"/>
  <circle cx="578" cy="474" r="4" fill="#34d399" opacity=".35"/>
  <circle cx="540" cy="520" r="3" fill="#34d399" opacity=".30"/>

  <!-- chip data -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <rect x="52" y="196" width="136" height="58" rx="14" fill="#052e22" stroke="#34d399" stroke-opacity=".30"/>
      <text x="68" y="218" fill="#6ee7b7" font-size="10" letter-spacing="1.6">METANA</text>
      <text x="68" y="241" fill="#ecfdf5" font-size="18" font-weight="700">1.180 ppm</text>
      <path d="M188 225h30" stroke="#34d399" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
    <g>
      <rect x="486" y="112" width="112" height="58" rx="14" fill="#052e22" stroke="#22d3ee" stroke-opacity=".30"/>
      <text x="502" y="134" fill="#67e8f9" font-size="10" letter-spacing="1.6">SUHU</text>
      <text x="502" y="157" fill="#ecfdf5" font-size="18" font-weight="700">36,2 °C</text>
      <path d="M486 141h-26" stroke="#22d3ee" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
    <g>
      <rect x="54" y="404" width="132" height="58" rx="14" fill="#052e22" stroke="#a3e635" stroke-opacity=".30"/>
      <text x="70" y="426" fill="#bef264" font-size="10" letter-spacing="1.6">KELEMBAPAN</text>
      <text x="70" y="449" fill="#ecfdf5" font-size="18" font-weight="700">88,2 %</text>
      <path d="M186 433h26" stroke="#a3e635" stroke-opacity=".35" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- gelombang wifi -->
  <g stroke="#34d399" stroke-opacity=".48" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M355 88a18 18 0 0 1 18 18"/>
    <path d="M355 72a34 34 0 0 1 34 34"/>
  </g>
</svg>
